name: Compatibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ['ubuntu:20.04', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in install.sh Plus menu Modulos/*; do bash -n "$script"; done
      - name: Build and run distro integration checks
        run: |
          docker build --build-arg DISTRO=${{ matrix.distro }} -f tests/Dockerfile -t vpnmanager-test .
          docker run --rm vpnmanager-test
      - name: Test real OpenVPN authentication over TCP, HTTP and WebSocket
        run: docker run --rm --cap-add NET_ADMIN --entrypoint python3 vpnmanager-test tests/openvpn_live.py
      - name: Test shared UDP authentication, data relay and online counts
        run: |
          python3 tests/fetch_hysteria.py /tmp/hysteria-test
          docker run --rm -v /tmp/hysteria-test:/tmp/hysteria-test:ro --entrypoint python3 vpnmanager-test tests/udp_live.py
      - name: Restore a full encrypted backup into another fresh container
        if: matrix.distro == 'ubuntu:20.04'
        run: |
          docker run --rm --entrypoint python3 vpnmanager-test tests/installer_smoke.py
          mkdir -p "$RUNNER_TEMP/vpnmanager-migration"
          docker run --rm --cap-add NET_ADMIN -v /tmp/hysteria-test:/tmp/hysteria-test:ro -v "$RUNNER_TEMP/vpnmanager-migration:/transfer" --entrypoint python3 vpnmanager-test tests/migration_smoke.py export
          docker run --rm --cap-add NET_ADMIN -v /tmp/hysteria-test:/tmp/hysteria-test:ro -v "$RUNNER_TEMP/vpnmanager-migration:/transfer:ro" --entrypoint python3 vpnmanager-test tests/migration_smoke.py restore

  badvpn-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned BadVPN source used by menu 18
        run: python3 tests/badvpn_build.py
